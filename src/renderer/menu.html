<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'" />
  <title>DSH Client Menu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: #1b1f27;
      border-bottom: 1px solid #262c36;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
      overflow: hidden;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    button {
      appearance: none;
      border: 1px solid #343b47;
      background: #232933;
      color: #c7cdd8;
      font-size: 12px;
      line-height: 22px;
      padding: 0 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #2c3440;
      border-color: #4c8bf5;
      color: #fff;
    }
    button:active { background: #1f2530; }

    .address-wrap {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      height: 26px;
      padding: 0 6px 0 10px;
      background: #14161a;
      border: 1px solid #2a2f39;
      border-radius: 4px;
    }
    .address-wrap[hidden] { display: none; }

    .protocol {
      flex-shrink: 0;
      font-size: 12px;
      user-select: none;
    }
    .url {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #e8eaed;
      font-size: 12px;
      user-select: text;
      cursor: text;
    }
    .copy {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: none;
      background: transparent;
      color: #9aa3af;
      border-radius: 4px;
    }
    .copy:hover {
      background: #2c3440;
      color: #fff;
      border: none;
    }
    .copy:active { background: #1f2530; }
  </style>
</head>
<body>
  <div class="actions">
    <button id="home" type="button">主页</button>
    <button id="refresh" type="button">刷新</button>
    <button id="about" type="button">关于</button>
  </div>
  <div id="address-wrap" class="address-wrap" hidden>
    <span id="address-protocol" class="protocol"></span>
    <span id="address-url" class="url"></span>
    <button id="copy-url" class="copy" type="button" title="复制地址" aria-label="复制地址">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
    </button>
  </div>
</body>
</html>
